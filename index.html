<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSE'29</title>
<link href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--gold:#9a7035;--gold2:#c79a52;--text:#f3ede2;--mute:#8d8575;--new:#f2e600;--red:#e5262b;--blue:#4a86b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Trade Winds',cursive,serif;line-height:1.5}
.hero{position:relative;background:var(--bg)}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b5a3c;font-size:14px}
.hero img{width:100%;height:auto;display:block}
.mob{display:none;position:relative}
.mob .mph{position:absolute;left:0;top:24%;height:48%;object-fit:cover;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
@media (max-width:700px){.hero .dsk{display:none}.mob{display:block}}
.logo{position:absolute;top:20px;right:22px;width:56px;height:auto}
h1{margin:-40px 0 0 6%;font-weight:400;font-size:clamp(56px,11vw,110px);color:var(--gold2);position:relative;line-height:1}
main{max-width:900px;margin:0 auto;padding:60px 20px 80px;display:flex;flex-direction:column;gap:28px}
.box{border:2px solid var(--gold);border-radius:22px;background:#050505}
.notes{border-color:var(--red);padding:26px 22px}
.notes h2,.sec h2{margin:0 0 14px;font-weight:400;font-size:22px;text-align:center}
.note{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #2a2a2a;font-size:16px}
.note a{color:var(--gold2)}
.note small{color:var(--mute)}
.left{color:var(--gold2);white-space:nowrap}
.course>button{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:38px 20px;font-size:26px;cursor:pointer;border-radius:20px}
.course>button:focus-visible,.tab:focus-visible,.lec:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.course small{display:block;color:var(--mute);font-size:14px;margin-top:4px}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.course.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.inner{padding:6px 18px 22px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tab{all:unset;cursor:pointer;padding:8px 18px;border:1.5px solid var(--gold);border-radius:999px;font-size:15px}
.tab.on{background:var(--gold);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.lec{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid #fff4;border-radius:16px;padding:18px 14px;text-align:center;display:block}
.lec b{display:block;font-weight:400;color:var(--mute);font-size:13px}
.lec.new{border-color:var(--new)}
.lec.new b{color:var(--new)}
.lec.off{opacity:.4;pointer-events:none}
.pic{display:block;border:2px solid #fff4;border-radius:16px;overflow:hidden;color:var(--text);text-decoration:none;text-align:center;padding-bottom:10px;font-size:14px}.pic span{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:#151515;color:#555;margin-bottom:8px}.pic img{width:100%;height:100%;object-fit:cover}
.drive{display:block;border-color:var(--blue);padding:38px 20px;text-align:center;font-size:26px;color:var(--text);text-decoration:none}
.drive small{display:block;color:var(--mute);font-size:14px;margin-top:4px}
.drive.off{opacity:.4;pointer-events:none}
.drive:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.sched{padding:26px 18px;border-color:#8a8a8a}.sched h2{margin:0 0 16px;font-weight:400;font-size:22px;text-align:center}
.shead{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;font-size:22px;color:#b5b5b5;cursor:pointer;padding:6px 0}
.shead:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.sbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.sched.open .sbody{grid-template-rows:1fr}
.sbody>div{overflow:hidden;padding-top:16px}
.dbar{display:flex;border:1.5px solid #8a8a8a;border-radius:999px;overflow:hidden}
.dbar button{all:unset;box-sizing:border-box;flex:1 0 96px;text-align:center;padding:12px 6px;cursor:pointer;font-size:15px;border-left:1.5px solid #8a8a8a}
.dbar button:first-child{border-left:0}
.dbar button.on{background:#8a8a8a;color:#050505}
.dbar button.today::after{content:'';display:block;width:6px;height:6px;border-radius:50%;background:#b5b5b5;margin:2px auto 0}
.dbar button:focus-visible{outline:3px solid var(--gold2);outline-offset:-3px}
@media(max-width:700px){.dbar{overflow-x:auto}}
.spanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.spanel.open{grid-template-rows:1fr}.spanel>div{overflow:hidden}
#slots{display:grid;grid-template-columns:1fr;gap:12px;padding-top:16px}
.slot{border:2px solid #fff4;border-radius:16px;padding:14px 18px}
.kd{display:inline-block;font-style:normal;font-size:11px;letter-spacing:.5px;color:var(--bg);background:var(--gold2);border-radius:999px;padding:1px 9px;margin-right:8px;vertical-align:middle}
.srow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.slot b{font-weight:400;font-size:18px;color:var(--gold2);text-align:left}.slot .srow span{color:var(--text);font-size:15px}.slot .srow span:nth-of-type(1){text-align:center}.slot .srow span:nth-of-type(2){text-align:right;color:var(--mute)}
.slot .note2{display:block;margin-top:8px;padding-top:8px;border-top:1px solid #2a2a2a;font-style:normal;font-size:12px;color:#6f685b;opacity:.9}
.sched{border-color:#8b93a1}.sched .dbar{border-color:#8b93a1}.sched .dbar button{border-left-color:#8b93a1}.sched .dbar button.on{background:#6e7683}.sched .dbar button.today::after{background:#c3c8d0}.sched .slot b{color:#c3c8d0}.sched .kd{background:#8b93a1}
.empty{color:var(--mute);text-align:center;padding:14px}
@media (prefers-reduced-motion:reduce){.panel{transition:none}html{scroll-behavior:auto}}
</style>
</head>

function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}
 else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}
 if(c||row.length){row.push(c);r.push(row)}
 const h=r.shift().map(x=>x.trim());return r.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}

const pd=s=>{s=String(s||'').trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m)return new Date(m[3].length==2?2000+ +m[3]:+m[3],m[2]-1,+m[1]);m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return new Date(+m[1],m[2]-1,+m[3]);return new Date(s)};

 D.courses.forEach(c=>{
  const items=D.content.filter(x=>x.course_id==c.course_id).sort((a,b)=>b.week-a.week);
  const ks=KINDS.filter(k=>(k[0]!='board'||BOARD.includes(c.course_id))&&!(HIDE[c.course_id]||[]).includes(k[0]));
  const el=document.createElement('div');el.className='box course';
  el.innerHTML=`<button aria-expanded="false">${esc(c.name)}<small>${esc(c.doctor||'')}</small></button>
  <div class="panel"><div><div class="inner"><div class="tabs">${ks.map((k,i)=>`<button class="tab${i?'':' on'}" data-k="${k[0]}">${k[1]}</button>`).join('')}</div><div class="grid"></div></div></div></div>`;
  const grid=el.querySelector('.grid');
  const show=k=>{const l=items.filter(x=>x.kind==k);grid.innerHTML=l.length?l.map(k=='board'?pic:card).join(''):'<div class="empty">Nothing here yet</div>'};
  show('lecture');
  el.querySelector('.course>button').onclick=function(){const o=el.classList.toggle('open');this.setAttribute('aria-expanded',o)};
  el.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{el.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');show(t.dataset.k)});
  root.appendChild(el);
 });
 const names={};D.courses.forEach(c=>{names[c.course_id]=c.name;names[(c.name||'').toLowerCase()]=c.name});
 const bar=document.getElementById('dbar'),pan=document.getElementById('spanel'),slots=document.getElementById('slots');
 const tk=['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];let cur=null;
 DAYS.forEach(([n,k])=>{const b=document.createElement('button');b.textContent=n;if(k==tk)b.classList.add('today');
  b.onclick=()=>{if(cur===k){cur=null;pan.classList.remove('open');b.classList.remove('on');return}
   cur=k;bar.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
   const l=(D.schedule||[]).filter(s=>(s.day||'').trim().slice(0,3).toLowerCase()==k);
   slots.innerHTML=l.length?l.map(s=>{const c=(s.course||s.course_id||'').trim();return `<div class="slot"><div class="srow"><b>${s.kind?`<i class="kd">${esc(s.kind.trim().toUpperCase())}</i>`:''}${esc(names[c.toLowerCase()]||c)}</b><span>${esc(s.time||'')}</span><span>${esc(s.place||'')}</span></div>${s.note?`<em class="note2">${esc(s.note)}</em>`:''}</div>`}).join(''):'<div class="empty">No sections</div>';
   pan.classList.add('open')};
  bar.appendChild(b)});
 document.getElementById('shead').onclick=function(){const sc=document.getElementById('sched');const o=sc.classList.toggle('open');this.setAttribute('aria-expanded',o);if(!o){cur=null;pan.classList.remove('open');bar.querySelectorAll('button').forEach(x=>x.classList.remove('on'))}};
});
</script>
</body>
</html>
